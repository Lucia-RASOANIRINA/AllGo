# Infrastructure de développement local — AllGo
# 100 % MySQL depuis la Phase 6 : MongoDB a été entièrement retiré.

services:
  # Clone local de la base MariaDB du site web (arur4976_janga_market) — même
  # version majeure que la base en ligne (11.4) pour éviter les écarts de
  # comportement SQL entre local et production. Alimenté par un export
  # phpMyAdmin des 48 tables, jamais par une connexion directe à la base
  # hébergée : ce conteneur ne doit JAMAIS écrire vers la base en ligne.
  mariadb:
    image: mariadb:11.4
    container_name: allgo-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: allgo_dev_root
      MARIADB_DATABASE: arur4976_janga_market
      MARIADB_USER: allgo_dev
      MARIADB_PASSWORD: allgo_dev
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      # Tout fichier .sql déposé ici est importé automatiquement au premier
      # démarrage (dumps phpMyAdmin des 48 tables, un fichier par table).
      - ./migration/dumps:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: allgo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mariadb-data:
  redis-data:
