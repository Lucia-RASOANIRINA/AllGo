org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Compilation incrémentale Kotlin désactivée — contrainte du poste, pas du projet.
#
# Le cache incrémental de Kotlin stocke des chemins RELATIFS entre les sources
# et le module (`RelocatableFileToPathConverter`). Or le cache pub est sur C:
# et le projet sur D: :
#
#   IllegalArgumentException: this and base files have different roots:
#     C:\Users\…\Pub\Cache\hosted\pub.dev\firebase_analytics-11.6.0\…
#     and D:\AllGo-Mobile\mobile\android
#
# Aucun chemin relatif n'existe entre deux racines Windows distinctes : chaque
# greffon écrit en Kotlin (firebase_analytics, mobile_scanner,
# flutter_image_compress, sentry_flutter, share_plus, package_info_plus) fait
# alors échouer la compilation. `flutter clean` ne corrige rien, le défaut
# revient à la compilation suivante.
#
# Deux alternatives ont été écartées : déplacer le cache pub ou le projet
# changerait la configuration de tout le poste pour un défaut local à ce dépôt.
# On perd ici la recompilation incrémentale des greffons — quelques dizaines de
# secondes — et rien d'autre.
#
# À retirer si le projet et le cache pub se retrouvent un jour sur le même
# volume, ou quand KT-63886 sera corrigé en amont.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
